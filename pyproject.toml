[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "pyhypervolt"
version = "1.0.0"
description = "Unofficial local BLE client for Hyperice Hypervolt devices"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "MaxPi" }]
keywords = ["hypervolt", "hyperice", "bluetooth", "ble", "massage-gun"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Home Automation",
]
dependencies = ["bleak>=1.0.0", "typing-extensions>=4.0"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.9"]

[project.scripts]
hypervolt = "pyhypervolt.cli:main"

[project.urls]
Documentation = "https://github.com/Taxom/pyhypervolt#readme"
Issues = "https://github.com/Taxom/pyhypervolt/issues"
Source = "https://github.com/Taxom/pyhypervolt"

[tool.hatch.build.targets.wheel]
packages = ["src/pyhypervolt"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
